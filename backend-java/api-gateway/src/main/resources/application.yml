server:
  port: 8080

spring:
  application:
    name: his-api-gateway
  cloud:
    gateway:
      routes:
        - id: patient-admission-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/er/**, /api/v1/admissions/**, /api/gateway/er/**, /api/api/gateway/er/**, /api/v1/pharmacy/**, /api/gateway/prescriptions/**, /api/api/gateway/prescriptions/**

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
